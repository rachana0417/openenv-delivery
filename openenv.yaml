name: openenv-delivery

description: >
  A grid-based delivery environment where an agent must navigate
  to delivery locations and complete tasks efficiently.

version: "1.0"

api:
  base_url: https://rachana0417-openenv-delivery.hf.space

tasks:
  - id: easy
    description: Single delivery location, small grid
    max_steps: 20

  - id: medium
    description: Multiple delivery locations
    max_steps: 40

  - id: hard
    description: Complex delivery with multiple goals
    max_steps: 60

actions:
  type: discrete
  values: ["up", "down", "left", "right"]

observations:
  type: object
  properties:
    agent_position:
      type: array
      items: integer
    delivery_locations:
      type: array
      items:
        type: array
        items: integer
    delivered:
      type: array
      items: boolean
    steps:
      type: integer

reward:
  description: >
    Agent receives negative reward per step and positive reward
    for completing deliveries.

end_conditions:
  - all deliveries completed
  - max steps reached